name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "vercel-deploy"
  cancel-in-progress: false

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Auto-Deploy
        run: |
          echo "Triggering Vercel Production Deployment..."
          curl -f -X POST "https://api.vercel.com/v1/integrations/deploy/prj_Y2qJOggrsZANkBIxBlnjCHsrkeVa/TYm0PL6XQo"
          echo "Vercel deployment triggered successfully!"
